openapi: 3.0.3
info: { title: Signature Orchestrator API - operations portal support, version: "1.0" }
paths:
  /v1/signature-processes:
    get:
      summary: Lista processos (portal operacional)
      parameters:
        - { name: status, in: query, schema: { type: string, description: estado de negócio } }
        - { name: operationalStatus, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, description: parte do id ou do externalId } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProcessListItem' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "400": { description: filtro inválido (status desconhecido) }
  /v1/signature-processes/{id}/provider:
    get:
      summary: Metadados do provider (acesso auditado)
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderInfo' }
        "404": { description: processo ou registro no provider inexistente }
  /v1/dead-letters:
    get:
      summary: Dead letters (filtro processId adicionado)
      parameters:
        - { name: processId, in: query, schema: { type: string } }
      responses: { "200": { description: ok } }
components:
  parameters:
    OperatorId:
      name: X-Operator-Id
      in: header
      required: false
      description: Identificador do operador (máx. 100, letras, dígitos e ._@:-); registrado como ator OPERATOR no journal
      schema: { type: string, maxLength: 100 }
  schemas:
    ProcessListItem:
      type: object
      properties:
        processId: { type: string }
        externalId: { type: string }
        documentFileName: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        signersSigned: { type: integer }
        signersTotal: { type: integer }
        businessStatus: { type: string }
        operationalStatus: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        sla: { type: string, enum: [OK, ALERT] }
    ProviderInfo:
      type: object
      properties:
        provider: { type: string }
        providerProcessId: { type: string }
        externalReference: { type: string }
        normalizedStatus: { type: string }
        metadata: { type: object }
        updatedAt: { type: string, format: date-time }
